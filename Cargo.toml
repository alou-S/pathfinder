[package]
name = "mbtunnel"
version = "0.1.0"
edition = "2024"

[dependencies]
chacha20 = "0.10.0"
chrono = { version = "0.4.44", features = ["serde"] }
eframe = "0.34.3"
egui_extras = "0.34.3"
getrandom = "0.4.3"
regex = "1.12.3"
rfd = "0.17.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }
zstd = "0.13.3"
tokio = { version = "1.52.2", features = ["rt", "rt-multi-thread"] }
reqwest = { version = "0.13.4", features = ["http3", "blocking"] }
anyhow = "1.0.103"
futures-util = "0.3.32"
sha2 = "0.11.0"
hex = "0.4.3"
flate2 = "1.1.9"
ur-taking-me-with-you = "8.0.1"
egui_sgr = "0.3.0"
owo-colors = "4.3.0"

[target.'cfg(not(windows))'.dependencies]
libc = "0.2.186"

[profile.release]
strip = true
lto = "none"
opt-level = 3
codegen-units = 1
