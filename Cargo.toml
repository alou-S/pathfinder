[package]
name = "mbtunnel"
version = "0.1.0"
edition = "2024"

[dependencies]
chacha20 = "0.10.0"
chrono = { version = "0.4.44", features = ["serde"] }
eframe = "0.35.0"
egui_extras = "0.35.0"
getrandom = "0.4.3"
regex = "1.12.3"
rfd = "0.17.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }
zstd = "0.13.3"
tokio = "1.52.2"
reqwest = { version = "0.13.4", features = ["http3", "blocking"] }
anyhow = "1.0.103"
futures-util = "0.3.32"
sha2 = "0.11.0"
hex = "0.4.3"

[target.'cfg(not(windows))'.dependencies]
libc = "0.2.186"

[target.'cfg(windows)'.dependencies]
wireguard-nt = "0.5.0"

[profile.release]
strip = true
lto = "none"
opt-level = "z"
codegen-units = 1
