[package]
name = "pathfinder"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22.1"
cliclack = "0.3.6"
colored = "3.0.0"
command-error = "0.6.0"
dont_disappear = "3.0.1"
futures = "0.3.31"
futures-util = "0.3.31"
indicatif = "0.15.0"
lazy_static = "1.5.0"
rand = "0.9.2"
regex = "1.11.2"
reqwest = { version = "0.12.23", features = ["stream", "json"] }
rfd = "0.15.4"
serde_json = "1.0.143"
sha2 = "0.10.9"
tokio  = { version = "1.47.1", features = ["full"] }
windows = {version = "0.61.3", features = ["Win32_UI_Input_KeyboardAndMouse"]}
windows-sys = {version = "0.60.2", features = ["Win32_System_Console", "Win32_Foundation"] }
x25519-dalek = {version = "2.0.1", features = ["static_secrets"] }
zstd = "0.13.3"

[build-dependencies]
embed-resource = "3.0.6"

[profile.release]
strip = true
lto = "thin"
opt-level = "z"
codegen-units = 1

[[bin]]
name = "pathfinder"
path = "src/main.rs"
